name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --configuration Release
      - name: Run the C tests again with clang (-Wall -Werror), as on macOS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang
          ESHARP_TEST_CC=clang dotnet test --configuration Release
  windows:
    # #11: the dotnet test run, the emit-only builds and a package round trip on Windows. No Docker or FS-UAE here.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Line ending setting (autocrlf is true on the runner by default)
        run: git config core.autocrlf
        continue-on-error: true
      - run: dotnet test --configuration Release
      - name: Emit-only builds, host test run, tree stays clean
        shell: bash
        run: |
          dotnet run --project src/ESharp.Cli -- build samples/hello --emit-only
          dotnet run --project src/ESharp.Cli -- build samples/cards --emit-only
          dotnet run --project src/ESharp.Cli -- test samples/linq | tee linq.log
          ! grep -q FAIL linq.log
          rm linq.log
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Pack, install the tool from the local folder, esharp new, dotnet run, esharp test
        shell: bash
        run: |
          v=0.0.0-ci.${{ github.run_number }}
          dotnet pack ESharp.sln --configuration Release --output artifacts/packages -p:Version=$v
          work=$(mktemp -d)
          export NUGET_PACKAGES="$work/packages" DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1
          unset ESHARP_ROOT ESHARP_REPO
          feed=$(pwd)/artifacts/packages
          dotnet tool install AmigaESharp.Tool --tool-path "$work/tool" --version $v --add-source "$feed"
          cd "$work"
          esharp="$work/tool/esharp.exe"
          # Restore the demo from the local feed (as tools/package-smoke.sh does), not from nuget.org: a published
          # AmigaESharp.Sdk with another version would otherwise be picked up silently (NU1603).
          winfeed=$(cygpath -w "$feed")
          cat > "$work/nuget.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$winfeed" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          test "$("$esharp" --version | tr -d '\r')" = "$v"
          "$esharp" new demo
          grep -q "<PackageReference Include=\"AmigaESharp.Sdk\" Version=\"$v\" />" demo/demo.csproj
          cd demo
          dotnet build -nologo 2>&1 | tee build.log
          dotnet run 2>&1 | tee run.log
          grep -q 'Hello from E#!' run.log
          "$esharp" test 2>&1 | tee test.log
          "$esharp" build --emit-only 2>&1 | tee emit.log
          test -s obj/m68k/demo.c
          ! grep -q NU1603 build.log run.log test.log emit.log
          grep -q "AmigaESharp.Sdk" demo.csproj
  packages:
    # Pack AmigaESharp.Tool and AmigaESharp.Sdk as release.yml does, install them from a local folder feed and use them
    # away from the checkout (tools/package-smoke.sh). Nothing is published.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack
        run: dotnet pack ESharp.sln --configuration Release --output artifacts/packages -p:Version=0.0.0-ci.${{ github.run_number }}
      - name: Install from a local feed, esharp new, build, test, emit C and build for m68k
        run: tools/package-smoke.sh artifacts/packages 0.0.0-ci.${{ github.run_number }} amigadev/crosstools:m68k-amigaos@sha256:32ec76dac03a642203f0f09f0416480d6c25de1092ed7ed472db870304a64859
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Free runner disk space (the image with AROS is about 5.7 GB and its source images more)
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          docker image prune -af >/dev/null
          df -h /
      - name: Build the Amiga toolchain image
        run: |
          docker build -t esharp-amiga-toolchain docker
          docker builder prune -af
          df -h /
      - name: Smoke-test every target compiler
        run: docker/smoke-test.sh
      - name: Build the hello sample for every target
        run: |
          for t in m68k os4 morphos aros; do
            dotnet run --project src/ESharp.Cli -- build samples/hello --target $t --docker
          done
      - name: Run hello in FS-UAE (m68k, AROS ROM replacement)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fs-uae xvfb
          dotnet run --project src/ESharp.Cli -- run samples/hello --docker --headless | tee run.log
          grep -qx 'Hello from E#!' run.log
  sdl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          docker image prune -af >/dev/null
          df -h /
      - name: Build the SDL 3 image (gcc plus SDL 3 built from a pinned release)
        run: |
          docker build -t esharp-sdl docker/sdl
          docker builder prune -af
          df -h /
      - name: Smoke-test SDL 3 (static link, offscreen video, dummy audio)
        run: docker/sdl/smoke-test.sh
      - name: hello, language and cards on the sdl target (headless in the image)
        run: |
          dotnet run --project src/ESharp.Cli -- run samples/hello --target sdl --docker esharp-sdl --headless | tee hello.log
          grep -q "Hello from E#!" hello.log
          # host and SDL must give the same ok lines
          dotnet run --project src/ESharp.Cli -- test samples/language --target sdl --docker esharp-sdl
          dotnet run --project src/ESharp.Cli -- test samples/cards --target sdl --docker esharp-sdl
          # scripted input after SHOT (a click on Higher, then Esc) and a screenshot of the frame
          dotnet run --project src/ESharp.Cli -- run samples/cards --target sdl --docker esharp-sdl --headless \
            --input "click 60,145;key 9" --screenshot cards-sdl.png | tee cards.log
          grep -q "guess higher" cards.log
          grep -q "^quit" cards.log
          test -s cards-sdl.png
