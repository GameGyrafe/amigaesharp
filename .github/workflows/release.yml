name: Release

# On every push to main (and on demand), tests, packs and publishes AmigaESharp.Tool and AmigaESharp.Sdk to nuget.org
# as VERSION_PREFIX.<run number>, then tags the commit vX.Y.Z and creates a GitHub release with the packages attached.
# RELEASE_SUFFIX is empty for a stable version; set it to a suffix such as '-preview' to publish a prerelease.
# Publishing uses nuget.org trusted publishing (GitHub OIDC), so no long-lived API key is stored: nuget.org needs a
# trusted publishing policy for GameGyrafe/amigaesharp, this workflow file (release.yml) and the environment nuget,
# whose secret NUGET_USER holds the nuget.org account name that owns the policy.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION_PREFIX: '0.1'
  RELEASE_SUFFIX: ''

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version
        id: version
        run: |
          v="$VERSION_PREFIX.${{ github.run_number }}$RELEASE_SUFFIX"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"
      - name: Test
        run: dotnet test --configuration Release
      - name: Pack
        run: dotnet pack ESharp.sln --configuration Release --output artifacts/packages -p:Version=${{ steps.version.outputs.version }}
      - name: Smoke-test the packages from a local feed
        run: tools/package-smoke.sh artifacts/packages ${{ steps.version.outputs.version }} amigadev/crosstools:m68k-amigaos@sha256:32ec76dac03a642203f0f09f0416480d6c25de1092ed7ed472db870304a64859
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ steps.version.outputs.version }}
          path: artifacts/packages/*.nupkg

  # Only this job can request a GitHub OIDC token, and it runs no project code: it pushes the tested packages.
  publish:
    needs: release
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages-${{ needs.release.outputs.version }}
          path: artifacts/packages
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: nuget.org login (trusted publishing, short-lived key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  # Tag and GitHub release only after the packages are on nuget.org.
  github-release:
    needs: [release, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages-${{ needs.release.outputs.version }}
          path: artifacts/packages
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release create "v$VERSION" artifacts/packages/*.nupkg \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            ${RELEASE_SUFFIX:+--prerelease}
