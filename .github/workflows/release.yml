name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-suffix) tests, packs and publishes AmigaESharp.Tool and AmigaESharp.Sdk to nuget.org,
# both with version X.Y.Z. Needs the repository secret NUGET_API_KEY (a nuget.org key allowed to push AmigaESharp.*).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version from the tag
        id: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-suffix]"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Test
        run: dotnet test --configuration Release
      - name: Pack
        run: dotnet pack ESharp.sln --configuration Release --output artifacts/packages -p:Version=${{ steps.version.outputs.version }}
      - name: Smoke-test the packages from a local feed
        run: tools/package-smoke.sh artifacts/packages ${{ steps.version.outputs.version }} amigadev/crosstools:m68k-amigaos@sha256:32ec76dac03a642203f0f09f0416480d6c25de1092ed7ed472db870304a64859
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ steps.version.outputs.version }}
          path: artifacts/packages/*.nupkg
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then echo "the NUGET_API_KEY secret is not set"; exit 1; fi
          dotnet nuget push "artifacts/packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
