name: Feature request
description: A language feature, library or tool you would like
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to be able to do?
      description: The use case matters more than the solution. A short code example of what you would write is ideal.
    validations:
      required: true
  - type: textarea
    id: alt
    attributes:
      label: What do you do today instead?
